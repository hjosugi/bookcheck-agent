version: 1
backend:
  phases:
    preBuild:
      commands:
        # Amplify のビルドイメージに pnpm は入っていないので入れる。バージョンは
        # package.json の packageManager から引く（corepack が付ける "+sha512..." は落とす）。
        - npm install -g pnpm@$(node -p "require('./package.json').packageManager.split('@').pop().split('+')[0]")
        - node --version
        - pnpm --version
    build:
      commands:
        - pnpm install --frozen-lockfile
        # amplify_outputs.json はここで生成される。frontend フェーズより先に走る必要がある。
        - pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@$(node -p "require('./package.json').packageManager.split('@').pop().split('+')[0]")
        - pnpm --version
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
    postBuild:
      commands:
        - pnpm store prune
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookcheck-agent"
version = "0.1.0"
description = "Amazon Nova book checker running on Bedrock AgentCore"
requires-python = ">=3.12"
dependencies = [
  "aws-opentelemetry-distro",
  "bedrock-agentcore>=1.0.3",
  "botocore[crt]>=1.35.0",
  "nest-asyncio==1.6.0",
  "playwright==1.58.0",
  "requests==2.33.1",
  "strands-agents>=1.13.0",
  "strands-agents-tools==0.5.1",
]

[tool.uv]
# strands-agents-tools 0.5.1 declares pillow<13, but every open Pillow advisory
# is only fixed in 13.0.0. Pillow is imported only by strands_tools.image_reader
# and strands_tools.use_computer, which this agent does not load. Remove this
# once strands-agents-tools is upgraded past the pillow<13 cap.
override-dependencies = ["pillow>=13.0.0,<14"]

[tool.hatch.build.targets.wheel]
packages = ["."]

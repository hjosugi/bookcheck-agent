<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans CJK JP', 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#111">第13章ハンズオン 全体の流れ</text>
  <text x="24" y="58" font-size="12" fill="#777">上段=作業　下段=そこで生まれる値（後の手順で使う）</text>

  <!-- Phase boxes row 1 -->
  <g>
    <rect x="24" y="80" width="200" height="72" rx="10" fill="#eef4fb" stroke="#9dbfe0"/>
    <text x="38" y="106" font-size="13" font-weight="700" fill="#1a3f66">Phase 1  準備</text>
    <text x="38" y="126" font-size="11.5" fill="#333">Google OAuth クライアント</text>
    <text x="38" y="142" font-size="11.5" fill="#333">クレデンシャルプロバイダー</text>

    <rect x="256" y="80" width="200" height="72" rx="10" fill="#eef4fb" stroke="#9dbfe0"/>
    <text x="270" y="106" font-size="13" font-weight="700" fill="#1a3f66">Phase 2  エージェント実装</text>
    <text x="270" y="126" font-size="11.5" fill="#333">agentcore create</text>
    <text x="270" y="142" font-size="11.5" fill="#333">calendar_tool.py / main.py</text>

    <rect x="488" y="80" width="200" height="72" rx="10" fill="#eef4fb" stroke="#9dbfe0"/>
    <text x="502" y="106" font-size="13" font-weight="700" fill="#1a3f66">Phase 3  バックエンド配置</text>
    <text x="502" y="126" font-size="11.5" fill="#333">agentcore deploy</text>
    <text x="502" y="142" font-size="11.5" fill="#333">ランタイム + メモリー生成</text>

    <rect x="720" y="80" width="216" height="72" rx="10" fill="#eef4fb" stroke="#9dbfe0"/>
    <text x="734" y="106" font-size="13" font-weight="700" fill="#1a3f66">Phase 4  Webアプリ実装</text>
    <text x="734" y="126" font-size="11.5" fill="#333">Next.js テンプレート整理</text>
    <text x="734" y="142" font-size="11.5" fill="#333">UI + Route Handler 2本</text>
  </g>

  <!-- arrows row 1 -->
  <g stroke="#8aa8c4" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M228 116 L252 116"/>
    <path d="M460 116 L484 116"/>
    <path d="M692 116 L716 116"/>
  </g>

  <!-- outputs row 1 -->
  <g>
    <rect x="24" y="168" width="200" height="46" rx="8" fill="#fff8e6" stroke="#e2cf95"/>
    <text x="38" y="188" font-size="11" fill="#8a6d1a">→ クレデンシャル</text>
    <text x="38" y="204" font-size="11" fill="#8a6d1a">　 プロバイダー名</text>

    <rect x="488" y="168" width="200" height="46" rx="8" fill="#fff8e6" stroke="#e2cf95"/>
    <text x="502" y="188" font-size="11" fill="#8a6d1a">→ ランタイム ARN</text>
    <text x="502" y="204" font-size="11" fill="#8a6d1a">　 (13.4.5 でコピー)</text>
  </g>

  <!-- down arrow -->
  <path d="M828 156 L828 240" stroke="#8aa8c4" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Phase row 2 -->
  <g>
    <rect x="720" y="252" width="216" height="72" rx="10" fill="#eef4fb" stroke="#9dbfe0"/>
    <text x="734" y="278" font-size="13" font-weight="700" fill="#1a3f66">Phase 5  Amplify デプロイ</text>
    <text x="734" y="298" font-size="11.5" fill="#333">git push → 自動ビルド</text>
    <text x="734" y="314" font-size="11.5" fill="#333">Cognito が同時に作られる</text>

    <rect x="488" y="252" width="200" height="72" rx="10" fill="#fdeef0" stroke="#e0a3ad"/>
    <text x="502" y="278" font-size="13" font-weight="700" fill="#7a1f2e">Phase 6  結線（最難関）</text>
    <text x="502" y="298" font-size="11.5" fill="#333">SSRロール / 環境変数</text>
    <text x="502" y="314" font-size="11.5" fill="#333">JWT認証 / コールバックURL</text>

    <rect x="256" y="252" width="200" height="72" rx="10" fill="#eef4fb" stroke="#9dbfe0"/>
    <text x="270" y="278" font-size="13" font-weight="700" fill="#1a3f66">Phase 7  動作確認</text>
    <text x="270" y="298" font-size="11.5" fill="#333">チャット → カレンダー登録</text>
    <text x="270" y="314" font-size="11.5" fill="#333">トレース / ログ確認</text>

    <rect x="24" y="252" width="200" height="72" rx="10" fill="#eef4f0" stroke="#9dc4ad"/>
    <text x="38" y="278" font-size="13" font-weight="700" fill="#1c5238">Phase 8  クリーンアップ</text>
    <text x="38" y="298" font-size="11.5" fill="#333">公開されたままにしない</text>
    <text x="38" y="314" font-size="11.5" fill="#333">ランタイム/メモリー/ECR等</text>
  </g>

  <g stroke="#8aa8c4" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M716 288 L692 288"/>
    <path d="M484 288 L460 288"/>
    <path d="M252 288 L228 288"/>
  </g>

  <!-- outputs row 2 -->
  <rect x="720" y="340" width="216" height="62" rx="8" fill="#fff8e6" stroke="#e2cf95"/>
  <text x="734" y="360" font-size="11" fill="#8a6d1a">→ Amplify ドメイン URL</text>
  <text x="734" y="376" font-size="11" fill="#8a6d1a">→ Cognito ユーザープール ID</text>
  <text x="734" y="392" font-size="11" fill="#8a6d1a">→ Cognito クライアント ID</text>

  <!-- warning -->
  <rect x="24" y="430" width="912" height="62" rx="10" fill="#fdeef0" stroke="#e0a3ad"/>
  <text x="42" y="454" font-size="13" font-weight="700" fill="#7a1f2e">注意：agentcore deploy をやり直すと Phase 6 の設定が消える</text>
  <text x="42" y="476" font-size="12" fill="#333">コンソールで手入力したランタイム環境変数とインバウンド認証はリセットされる。バックエンド修正のたびに Phase 6 をやり直す。</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa8c4"/>
    </marker>
  </defs>
</svg>
